services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bug-hunter:latest
    container_name: bug-hunter-api
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bughunter:bughunter@postgres:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-15}
      - SECURITY_MODE=${SECURITY_MODE:-SAFE}
      - MAX_CONCURRENT_HOSTS=${MAX_CONCURRENT_HOSTS:-12}
      - MAX_CRAWL_DEPTH=3
      - MAX_ASSETS_PER_SCAN=${MAX_ASSETS_PER_SCAN:-2500}
      - MAX_URLS_PER_SCAN=${MAX_URLS_PER_SCAN:-20000}
      - MAX_RUNTIME_MINUTES=${MAX_RUNTIME_MINUTES:-45}
      - PORT_TIMEOUT_SECONDS=${PORT_TIMEOUT_SECONDS:-1.5}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-8.0}
      - MAX_HTTP_CONNECTIONS=${MAX_HTTP_CONNECTIONS:-64}
      - MAX_HTTP_KEEPALIVE_CONNECTIONS=${MAX_HTTP_KEEPALIVE_CONNECTIONS:-16}
      - MAX_CONCURRENT_PORT_PROBES=${MAX_CONCURRENT_PORT_PROBES:-32}
      - MAX_CONCURRENT_SERVICE_VALIDATIONS=${MAX_CONCURRENT_SERVICE_VALIDATIONS:-2}
      - CREDENTIAL_AUDIT_ENABLED=${CREDENTIAL_AUDIT_ENABLED:-true}
      - CREDENTIAL_AUDIT_MAX_ATTEMPTS=${CREDENTIAL_AUDIT_MAX_ATTEMPTS:-10}
      - CREDENTIAL_AUDIT_DELAY_SECONDS=${CREDENTIAL_AUDIT_DELAY_SECONDS:-0.75}
      - NMAP_VULN_ENABLED=${NMAP_VULN_ENABLED:-true}
      - NMAP_VULN_TIMEOUT_SECONDS=${NMAP_VULN_TIMEOUT_SECONDS:-120}
      - NMAP_VULN_MAX_PORTS=${NMAP_VULN_MAX_PORTS:-12}
      - NMAP_VULN_SCRIPT_TIMEOUT_SECONDS=${NMAP_VULN_SCRIPT_TIMEOUT_SECONDS:-30}
      - SSE_REPLAY_LIMIT=${SSE_REPLAY_LIMIT:-500}
      - SSE_CLIENT_QUEUE_SIZE=${SSE_CLIENT_QUEUE_SIZE:-256}
      - SSE_KEEPALIVE_SECONDS=${SSE_KEEPALIVE_SECONDS:-10}
      - AUTO_RESUME_SCANS_ON_STARTUP=${AUTO_RESUME_SCANS_ON_STARTUP:-false}
      - MAX_AUTO_RESUME_SCANS=${MAX_AUTO_RESUME_SCANS:-2}
      - MAX_CONCURRENT_SCANS=${MAX_CONCURRENT_SCANS:-2}
      - MAX_PENDING_SCANS=${MAX_PENDING_SCANS:-20}
      - MAX_BROWSER_CAPTURES=${MAX_BROWSER_CAPTURES:-1}
      - BROWSER_CAPTURE_ENABLED=${BROWSER_CAPTURE_ENABLED:-false}
      # Optional Free Cloud AI API Keys (Zero Local GPU/Disk Required):
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # AI Orchestrator Settings (propagated from host .env):
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-combo}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-25}
      - LLM_ROUTING_MODE=${LLM_ROUTING_MODE:-auto}
      # Optional analysis-only Hermes fallback. Leave blank for NineRouter-only mode.
      - HERMES_BASE_URL=${HERMES_BASE_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-hermes-agent}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./wordlists:/app/wordlists
    networks:
      - bughunter-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: bug-hunter-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bughunter
      - POSTGRES_PASSWORD=bughunter
      - POSTGRES_DB=bughunter
    ports:
      - "127.0.0.1:9002:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bughunter"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - bughunter-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: bug-hunter-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:9003:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - bughunter-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  redisdata:

networks:
  bughunter-net:
    driver: bridge
