services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bug-hunter-api
    ports:
      - "9001:9001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bughunter:bughunter@postgres:5432/bughunter
      - CORS_ORIGINS=*
      - RATE_LIMIT_RPS=10
      - SECURITY_MODE=SAFE
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bug-hunter-postgres
    environment:
      - POSTGRES_USER=bughunter
      - POSTGRES_PASSWORD=bughunter
      - POSTGRES_DB=bughunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bughunter"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: