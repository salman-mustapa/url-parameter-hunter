services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bug-hunter:latest
    container_name: bug-hunter-api
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bughunter:bughunter@postgres:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=*
      - RATE_LIMIT_RPS=15
      - SECURITY_MODE=CONTROLLED
      - MAX_CONCURRENT_HOSTS=12
      - MAX_CRAWL_DEPTH=3
      # Optional Free Cloud AI API Keys (Zero Local GPU/Disk Required):
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./wordlists:/app/wordlists
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: bug-hunter-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bughunter
      - POSTGRES_PASSWORD=bughunter
      - POSTGRES_DB=bughunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bughunter"]
      interval: 3s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: bug-hunter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  redisdata: