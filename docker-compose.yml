version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bug-hunter-api
    ports:
      - "9001:9001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://bug hunter:bug hunter@postgres:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-me-in-production
      - CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bug-hunter-worker
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://bug hunter:bug hunter@postgres:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bug-hunter-postgres
    environment:
      - POSTGRES_USER=bug hunter
      - POSTGRES_PASSWORD=bug hunter
      - POSTGRES_DB=bughunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bug hunter"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bug-hunter-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: bug-hunter-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
