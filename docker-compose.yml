services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bug-hunter:latest
    container_name: bug-hunter-api
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bughunter:bughunter@postgres:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - RATE_LIMIT_RPS=15
      - SECURITY_MODE=CONTROLLED
      - MAX_CONCURRENT_HOSTS=12
      - MAX_CRAWL_DEPTH=3
      - MAX_HTTP_CONNECTIONS=${MAX_HTTP_CONNECTIONS:-64}
      - MAX_HTTP_KEEPALIVE_CONNECTIONS=${MAX_HTTP_KEEPALIVE_CONNECTIONS:-16}
      - MAX_CONCURRENT_PORT_PROBES=${MAX_CONCURRENT_PORT_PROBES:-32}
      - MAX_CONCURRENT_SERVICE_VALIDATIONS=${MAX_CONCURRENT_SERVICE_VALIDATIONS:-2}
      - CREDENTIAL_AUDIT_ENABLED=${CREDENTIAL_AUDIT_ENABLED:-true}
      - NMAP_VULN_ENABLED=${NMAP_VULN_ENABLED:-true}
      - AUTO_RESUME_SCANS_ON_STARTUP=${AUTO_RESUME_SCANS_ON_STARTUP:-false}
      - MAX_AUTO_RESUME_SCANS=${MAX_AUTO_RESUME_SCANS:-2}
      # Optional Free Cloud AI API Keys (Zero Local GPU/Disk Required):
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # AI Orchestrator Settings (propagated from host .env):
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-nousresearch/hermes-3-llama-3.1-8b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./wordlists:/app/wordlists
    networks:
      - bughunter-net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: bug-hunter-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bughunter
      - POSTGRES_PASSWORD=bughunter
      - POSTGRES_DB=bughunter
    ports:
      - "127.0.0.1:9002:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bughunter"]
      interval: 3s
      timeout: 5s
      retries: 5
    networks:
      - bughunter-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: bug-hunter-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:9003:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - bughunter-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  redisdata:

networks:
  bughunter-net:
    driver: bridge
