[project]
name = "bug-hunter"
version = "0.1.0"
description = "Bug Hunting / Attack Surface Discovery Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.31",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "dnspython>=2.6.1",
    "beautifulsoup4>=4.12.3",
    "aiofiles>=23.3.1",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
